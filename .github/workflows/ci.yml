name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # lockfile と package.json がずれていたら失敗させる
      - run: yarn install --frozen-lockfile

      - run: yarn lint

      # 整形の漏れを検出する（書き換えはしない）
      - run: yarn prettier:check

      - run: yarn typecheck

      # テストとあわせてカバレッジをログに出力する（最低ラインでの失敗判定はしない）
      - run: yarn test:coverage

      # ビルドにシークレットは使わない（DB への実接続は行わない）
      - run: yarn build
