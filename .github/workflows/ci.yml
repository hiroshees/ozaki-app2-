name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # lockfile と package.json がずれていたら失敗させる
      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn typecheck

      # TODO: Vitest 導入（Issue #5）後に `yarn test:coverage` を追加する。
      # それまでは test スクリプトが無いため実行しない

      # ビルドにシークレットは使わない（DB への実接続は行わない）
      - run: yarn build
